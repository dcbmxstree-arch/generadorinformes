<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIESTUDIOS – Generador de Informes LaTeX</title>
    <style>
        :root {
            --color-primario: #0b3b6b;
            --color-secundario: #f4f7fc;
            --color-blanco: #ffffff;
            --color-error: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--color-secundario);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--color-blanco);
            max-width: 1000px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--color-primario);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #555;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            background: var(--color-primario);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
            display: inline-block;
        }

        .btn:hover {
            background: #084a7a;
        }

        .btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #resultado {
            margin-top: 30px;
            display: none;
        }

        #codigo-latex {
            width: 100%;
            height: 400px;
            font-family: 'Courier New', monospace;
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            resize: vertical;
        }

        .error {
            color: var(--color-error);
            margin-top: 20px;
            display: none;
        }

        .advertencia {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 MULTIESTUDIOS</h1>
            <p>Generador de Informes LaTeX para Especialistas en Ingeniería</p>
        </header>

        <div class="advertencia">
            ⚠️ <strong>Versión de pruebas:</strong> versión de pruebas.
        </div>

        <div class="form-group">
            <label>👤 Nombre completo del Ingeniero que emite el informe</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="form-group">
            <label>🎓 Carrera de especialización</label>
            <select id="carrera" required>
                <option value="">-- Seleccione --</option>
                <option>Ingeniería Mecánica</option>
                <option>Ingeniería Informática</option>
                <option>Ingeniería Civil</option>
                <option>Arquitectura</option>
                <option>Ingeniería Industrial</option>
                <option>Administración de Empresas</option>
            </select>
        </div>

        <div class="form-group">
            <label>📄 Caso práctico (pegue aquí el texto completo)</label>
            <textarea id="caso" placeholder="Pegue el contexto operacional y las preguntas..."></textarea>
        </div>

        <div class="form-group">
            <label>✅ Respuesta del caso (pegue aquí la respuesta oficial)</label>
            <textarea id="respuesta" placeholder="Pegue la respuesta estructurada..."></textarea>
        </div>

        <button id="generar" class="btn">🚀 Generar Informe LaTeX</button>

        <div id="error" class="error"></div>

        <div id="resultado">
            <h2 style="margin-bottom:15px;">Código LaTeX generado</h2>
            <textarea id="codigo-latex" readonly></textarea>
            <button id="copiar" class="btn" style="margin-top:10px;">📋 Copiar al portapapeles</button>
        </div>
    </div>

    <script>
        // ================= CONFIGURACIÓN =================
        const DEEPSEEK_API_KEY = 'sk-044520a24cfe4709b946c01cf2a3dcf6'; // ⚠️ SOLO PARA PRUEBAS
        const API_URL = 'https://api.deepseek.com/chat/completions';
        // =================================================

        document.getElementById('generar').addEventListener('click', async () => {
            const nombre = document.getElementById('nombre').value.trim();
            const carrera = document.getElementById('carrera').value;
            const caso = document.getElementById('caso').value.trim();
            const respuesta = document.getElementById('respuesta').value.trim();

            // Validación
            if (!nombre || !carrera || !caso || !respuesta) {
                mostrarError('Todos los campos son obligatorios.');
                return;
            }

            const btn = document.getElementById('generar');
            btn.disabled = true;
            btn.textContent = 'Generando...';
            ocultarError();
            ocultarResultado();

            try {
                const systemPrompt = construirSystemPrompt(nombre, carrera);
                const userMessage = `Caso práctico:\n${caso}\n\nRespuesta:\n${respuesta}`;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: userMessage }
                        ],
                        temperature: 0.1,
                        max_tokens: 8000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `Error HTTP ${response.status}`);
                }

                const data = await response.json();
                if (!data.choices || data.choices.length === 0) {
                    throw new Error('La API no devolvió contenido.');
                }

                const latexCode = data.choices[0].message.content;
                document.getElementById('codigo-latex').value = latexCode;
                document.getElementById('resultado').style.display = 'block';

            } catch (err) {
                mostrarError('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Generar Informe LaTeX';
            }
        });

        document.getElementById('copiar').addEventListener('click', () => {
            const codigo = document.getElementById('codigo-latex');
            codigo.select();
            document.execCommand('copy');
            alert('Código LaTeX copiado al portapapeles.');
        });

        function construirSystemPrompt(nombre, carrera) {
    return `Eres un experto en redacción técnica y LaTeX para la institución policial MULTIESTUDIOS.
Tu tarea es generar el código LaTeX COMPLETO de un informe de caso práctico para un aspirante a especialista en ${carrera}.

REGLAS OBLIGATORIAS:
1. NO INVENTES NINGUNA LEY, NORMA, ARTÍCULO O REFERENCIA TÉCNICA INEXISTENTE.
   - Solo puedes mencionar normativas si aparecen explícitamente en el caso o respuesta proporcionados.
   - Si el caso/respuesta menciona "LOSNCP", puedes referirte a sus principios generales (eficiencia, transparencia) pero NUNCA cites artículos concretos.
   - Si el texto original dice "según la normativa INEN 2 266 (verificar versión actual)", puedes incluir esa cita textual, pero NO agregues números de normas adicionales.
   - Si no hay normativa explícita, usa frases genéricas como "la normativa técnica aplicable", "los reglamentos institucionales".

2. El documento debe ser compilable sin errores en Overleaf.

3. ESTRUCTURA OBLIGATORIA DEL DOCUMENTO:
   - Portada profesional con: "MULTIESTUDIOS", "Centro de Educación Continua", la carrera "${carrera}", "Informe de Caso Práctico".
   - En la portada y en el pie de página debe figurar: "Ingeniero ${nombre}".
   - Sección 1: Caso Práctico (texto completo del caso proporcionado).
   - Sección 2: Mapa de Conocimientos Relacionados.
        **IMPORTANTE: Esta sección debe limitarse ESTRICTAMENTE a los campos propios de ${carrera}.**
        NO incluyas conocimientos de otras ingenierías (ej: si es Mecánica, no pongas "ingeniería eléctrica" o "civil").
        Debes listar entre 4 y 7 campos típicos de ${carrera}, y para cada campo escribir una lista con conceptos específicos que puedan aplicarse al caso.
        Además, incluye siempre los sub-apartados: "Doctrina Policial Aplicable" y "Normativa Técnica Relevante" (solo si aparece explícita en el caso/respuesta; si no, usa frases genéricas).
        Ejemplo (para Ingeniería Mecánica en un caso de armas):
            - Ciencia de Materiales: propiedades mecánicas, fatiga, dureza, tratamientos térmicos.
            - Mecánica de Materiales: esfuerzos, deformaciones, fallo por fractura.
            - Mecánica de Fluidos: flujo interno, pérdidas de carga, cavitación.
            - Ensayos No Destructivos: ultrasonidos, partículas magnéticas, tintas penetrantes.
            - Doctrina Policial: cadena de custodia, protocolos de seguridad.
            - Normativa Técnica: referencias generales sin inventar números.
   - Sección 3: Enlace de las Ideas y Campos.
        Explica cómo se conectan los síntomas del caso con los campos del mapa anterior.
        **Debes mencionar explícitamente los conceptos listados en el Mapa de Conocimientos** que resultan necesarios para abordar el problema.
        Muestra la relación lógica: "El síntoma X se analiza mediante el concepto Y del campo Z, lo que permite llegar a la respuesta W".
        No introduzcas campos fuera de ${carrera}.
   - Sección 4: Respuestas Estructuradas (las respuestas oficiales al caso, organizadas en subsecciones).
   - Sección 5: Conclusiones y Recomendaciones (basadas únicamente en la respuesta y el enlace de ideas).

4. FORMATO DEL CÓDIGO:
   - Comienza con \\documentclass[12pt,a4paper]{article} y termina con \\end{document}.
   - NO escribas ningún texto antes ni después del código LaTeX.
   - Paquetes recomendados: inputenc (utf8), fontenc (T1), babel (spanish,es-tabla), geometry, fancyhdr, enumitem, parskip, hyperref, booktabs.
   - El pie de página debe incluir "MULTIESTUDIOS – Curso de Especialización" a la izquierda y "Ingeniero ${nombre}" a la derecha.
   - Usa formato profesional, con márgenes de 2.5 cm.

5. NO uses imágenes. Solo texto.

A continuación se te proporcionan el caso práctico y su respuesta.`;
}

        function mostrarError(msg) {
            const errDiv = document.getElementById('error');
            errDiv.textContent = msg;
            errDiv.style.display = 'block';
        }

        function ocultarError() {
            document.getElementById('error').style.display = 'none';
        }

        function ocultarResultado() {
            document.getElementById('resultado').style.display = 'none';
        }
    </script>
</body>
</html>
